[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "comp5423-skill-search-agent"
version = "0.1.0"
description = "A fixed-corpus skill-augmented search agent with auditable predictions"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "python-dotenv==1.2.1",
  "numpy==2.3.5",
  "streamlit==1.51.0",
]

[project.optional-dependencies]
retrieval = ["torch==2.9.1", "transformers==4.57.3", "huggingface-hub==0.36.0", "datasets==4.4.1", "safetensors==0.7.0"]
dev = ["pytest==9.0.1", "ruff==0.14.6", "build==1.3.0"]
analysis = ["matplotlib==3.10.8"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
